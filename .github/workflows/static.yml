# Combined workflow for auto-translating and deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write # CHANGED from 'read' so the runner can push the sitemap back to repo
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- START TRANSLATION STEPS ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Translation Dependencies
        run: pip install beautifulsoup4

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: translation_cache.json
          key: translation-cache-${{ hashFiles('index.html', 'blog-post.html') }}
          restore-keys: |
            translation-cache-

      - name: Run Translation Engine
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python translate_site.py
      # --- END TRANSLATION STEPS ---

      # --- START SITEMAP STEP ---
      - name: Generate sitemap.xml
        run: python generate_sitemap.py

      - name: Commit and Push sitemap.xml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add sitemap.xml
          # Only commit and push if the sitemap file actually changed to avoid infinite run loops
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-generate sitemap.xml [skip ci]" && git push)
      # --- END SITEMAP STEP ---

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
