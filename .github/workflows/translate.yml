name: Auto Translate Pages
on:
  push:
    branches:
      - main

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install beautifulsoup4 deep-translator

      - name: Run Translation Engine
        run: python translate_site.py

      - name: Commit and Push Translated Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the translation outputs safely
          git add es/ index.html || echo "No Spanish directory found yet"
          git add fr/ index.html || echo "No French directory found yet"
          
          # Check if there are actual text changes to commit so it doesn't crash empty runs
          if git diff --staged --quiet; then
            echo "No translation adjustments detected. Skipping deployment."
          else
            git commit -m "Automated translation sync [skip ci]"
            git push origin main
          fi
